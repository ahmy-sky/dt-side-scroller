<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Awesome Side Scroller</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      canvas {
        background: #eee;
        display: block;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas" width="1000" height="1000"></canvas>

    <script>
      const canvas = document.getElementById("game-canvas");
      const ctx = canvas.getContext("2d");
      const bullets = [];
      const enemies = [];
      const enemySpawnInterval = 2000;
      let lastEnemySpawnTime = 0;

      const spaceShipSize = 20;
      const enemySize = 20;
      const bulletSize = 2;
      let spaceShipCoordinates = { x: 100, y: 300 };
      let mouseCoordinates = { x: 0, y: 0 };
      let gameOver = false;
      let health = 3;
      let collisionDetected = false;
      let keysPressed = {};
      const moveSpeed = 5;
      let isMousePressed = false;
      const fireRate = 40;
      let lastFireTime = 0;

      window.addEventListener("keydown", (e) => (keysPressed[e.code] = true));
      window.addEventListener("keyup", (e) => (keysPressed[e.code] = false));
      window.addEventListener("mousedown", handleMouseDown);
      window.addEventListener("mouseup", handleMouseUp);
      window.addEventListener("mousemove", handleMouseMove);

      function updateMovement() {
        if (keysPressed["KeyA"] || keysPressed["ArrowLeft"]) {
          spaceShipCoordinates.x -= moveSpeed;
        }
        if (keysPressed["KeyD"] || keysPressed["ArrowRight"]) {
          spaceShipCoordinates.x += moveSpeed;
        }
        if (keysPressed["KeyW"] || keysPressed["ArrowUp"]) {
          spaceShipCoordinates.y -= moveSpeed;
        }
        if (keysPressed["KeyS"] || keysPressed["ArrowDown"]) {
          spaceShipCoordinates.y += moveSpeed;
        }
      }

      function handleMouseClick(event) {
        shoot();
      }

      function handleMouseDown(event) {
        isMousePressed = true;
      }

      function handleMouseUp(event) {
        isMousePressed = false;
      }

      function handleMouseMove(event) {
        const rect = canvas.getBoundingClientRect();
        mouseCoordinates.x = event.clientX - rect.left;
        mouseCoordinates.y = event.clientY - rect.top;
      }

      function shoot() {
        const angle = calculateAngle();
        const bulletSpeed = 15;

        bullets.push({
          x: spaceShipCoordinates.x,
          y: spaceShipCoordinates.y,
          vx: Math.cos(angle) * bulletSpeed,
          vy: Math.sin(angle) * bulletSpeed,
        });
      }

      function calculateAngle() {
        const dx = mouseCoordinates.x - spaceShipCoordinates.x;
        const dy = mouseCoordinates.y - spaceShipCoordinates.y;
        return Math.atan2(dy, dx);
      }

      function drawSpaceShip() {
        const { x, y } = spaceShipCoordinates;
        const angle = calculateAngle();

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-20, -5);
        ctx.lineTo(-20, 5);
        ctx.lineTo(0, 0);
        ctx.fillStyle = "purple";
        ctx.fill();
        ctx.closePath();

        ctx.restore();
      }

      function drawBullet(bullet) {
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, 1, 0, Math.PI * 2);
        ctx.fillStyle = "black";
        ctx.fill();
      }

      function drawEnemy(enemy) {
        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, 10, 0, Math.PI * 2);
        ctx.fillStyle = "green";
        ctx.fill();
      }

      function drawHeart(x, y, size) {
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.bezierCurveTo(
          x,
          y - size / 2,
          x - size / 2,
          y - size / 2,
          x - size / 2,
          y
        );
        ctx.bezierCurveTo(
          x - size / 2,
          y + size / 2,
          x,
          y + size / 2,
          x,
          y + size
        );
        ctx.bezierCurveTo(
          x,
          y + size / 2,
          x + size / 2,
          y + size / 2,
          x + size / 2,
          y
        );
        ctx.bezierCurveTo(x + size / 2, y - size / 2, x, y - size / 2, x, y);
        ctx.fillStyle = "red";
        ctx.fill();
        ctx.closePath();
      }

      function drawHealth() {
        const healthStartX = 30;
        const healthStartY = 40;
        const heartSize = 30;
        const healthSpacing = 40;

        for (let i = 0; i < health; i++) {
          drawHeart(healthStartX + i * healthSpacing, healthStartY, heartSize);
        }
      }

      function draw(timestamp) {
        ctx.clearRect(0, 0, 1000, 1000);
        if (timestamp - lastEnemySpawnTime > enemySpawnInterval) {
          lastEnemySpawnTime = timestamp;
          enemies.push({ x: 800, y: 200 });
        }

        updateMovement();
        drawSpaceShip();
        drawHealth();

        const spaceShipRect = {
          x: spaceShipCoordinates.x - spaceShipSize / 2,
          y: spaceShipCoordinates.y - spaceShipSize / 2,
          width: spaceShipSize,
          height: spaceShipSize,
        };

        for (enemy of enemies) {
          drawEnemy(enemy);
          enemy.x -= 5;

          if (enemy.x < 0) {
            enemies.splice(enemies.indexOf(enemy), 1);
          }

          const enemyRect = {
            x: enemy.x - enemySize / 2,
            y: enemy.y - enemySize / 2,
            width: enemySize,
            height: enemySize,
          };

          if (
            detectCollision(
              spaceShipCoordinates.x,
              spaceShipCoordinates.y,
              spaceShipSize,
              enemyRect
            )
          ) {
            console.log("Collision between player and enemy!");
            health -= 1;
            enemies.splice(enemies.indexOf(enemy), 1);

            if (health <= 0) {
              gameOver = true;
              console.log("Game Over!");
            }

            break;
          }
        }

        for (bullet of bullets) {
          drawBullet(bullet);

          bullet.x += bullet.vx;
          bullet.y += bullet.vy;

          if (
            bullet.x < 0 ||
            bullet.x > canvas.width ||
            bullet.y < 0 ||
            bullet.y > canvas.height
          ) {
            bullets.splice(bullets.indexOf(bullet), 1);
          }

          for (const enemy of enemies) {
            const enemyRect = {
              x: enemy.x - enemySize / 2,
              y: enemy.y - enemySize / 2,
              width: enemySize,
              height: enemySize,
            };

            if (detectCollision(bullet.x, bullet.y, bulletSize, enemyRect)) {
              bullets.splice(bullets.indexOf(bullet), 1);
              enemies.splice(enemies.indexOf(enemy), 1);
              console.log("Collision between bullet and enemy!");
              break;
            }
          }
        }

        if (isMousePressed && timestamp - lastFireTime > fireRate) {
          shoot();
          lastFireTime = timestamp;
        }

        if (!gameOver) {
          requestAnimationFrame(draw);
        }
      }

      function isPointInsideRectangle(px, py, rect) {
        return (
          px >= rect.x &&
          px <= rect.x + rect.width &&
          py >= rect.y &&
          py <= rect.y + rect.height
        );
      }

      function detectCollision(px, py, size, rect) {
        return isPointInsideRectangle(px, py, rect);
      }

      function resetGame() {
        bullets.length = 0;
        enemies.length = 0;
        spaceShipCoordinates = { x: 100, y: 300 };
        gameOver = false;
        requestAnimationFrame(draw);
        console.log("Game has been reset.");
      }

      requestAnimationFrame(draw);
    </script>
  </body>
</html>
